{{define "admin_head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/dzarlax.css">
<script src="/static/dzarlax.js" defer></script>
<script src="/static/htmx.min.js" defer></script>
<script>
  document.addEventListener("htmx:beforeSwap", function (event) {
    var detail = event.detail || {};
    var xhr = detail.xhr;
    if (!xhr || xhr.status < 400) return;
    detail.shouldSwap = false;
    detail.isError = false;
    var source = detail.requestConfig && detail.requestConfig.elt ? detail.requestConfig.elt : event.target;
    var host = source && source.closest ? source.closest("[data-model-card], .card__body, section") : null;
    if (!host) host = document.body;
    var old = host.querySelector(":scope > .admin-inline-error");
    if (old) old.remove();
    var box = document.createElement("div");
    box.className = "admin-inline-error";
    box.setAttribute("role", "alert");
    box.textContent = (xhr.responseText || ("Request failed with HTTP " + xhr.status)).trim();
    host.prepend(box);
  });
</script>
<style>
  /* Admin UI overrides on top of the dzarlax design system. Anything that
     duplicates DS is deliberately absent — we rely on DS components for:
        • .navbar / .navbar__brand (page header)
        • .tab-nav / .tab-nav a.active (page tabs)
        • .kpi-bar / .kpi-item (metric row on Analytics)
        • .divider--labeled / .divider__label (chat session breaks)
        • .card / .card__body / .card__header (content panels)
        • [hidden] !important + input 16px (iOS zoom fix)
     Admin pages are full-width — design system navbar/container padding is
     intentionally bypassed so data-dense tables use every pixel. */
  body { padding: 0 1.5rem 2rem; margin: 0; max-width: none; }

  .admin-section { margin-bottom: 2rem; }
  .filters { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .filters label { display: inline-flex; gap: 0.25rem; align-items: center; }
  .catalog-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid rgba(0,0,0,0.1); flex-wrap: wrap; }
  .catalog-tabs, .catalog-view-toggle { display: inline-flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .catalog-sort { width: 10rem; }
  .catalog-sort-dir { width: 6.5rem; }
  .model-id { font-family: var(--font-mono, monospace); font-size: 0.875rem; }
  .caps-badges .badge { margin-right: 0.25rem; }
  .assign-buttons { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-top: 0.25rem; }
  .assign-buttons .btn { margin-right: 0.25rem; margin-bottom: 0.25rem; }
  .model-actions { margin-top: 0.75rem; display: grid; gap: 0.55rem; }
  .model-actions__check { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .model-check-status { color: var(--text-secondary); font-size: 0.78rem; }
  .model-check-status.ok { color: var(--success, #047857); }
  .model-check-status.warn { color: var(--warning, #9a5b00); }
  .model-check-status.running { color: var(--accent, #2563eb); }
  .model-op-link { font-size: 0.78rem; color: var(--text-secondary); }
  .model-op-status { display: inline-flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; margin-top: 0.35rem; font-size: 0.78rem; }
  .model-op-status.ok { color: var(--success, #047857); }
  .model-op-status.warn { color: var(--warning, #9a5b00); }
  .model-op-status.running { color: var(--accent, #2563eb); }
  .model-actions__check.htmx-request button, .model-actions__eval.htmx-request button { pointer-events: none; opacity: 0.7; }
  .model-actions__check .htmx-indicator, .model-actions__eval .htmx-indicator { margin-left: 0.35rem; }
  .admin-inline-error { margin-top: 0.5rem; padding: 0.45rem 0.6rem; border-radius: 6px; background: rgba(154,91,0,0.10); color: var(--warning, #9a5b00); font-size: 0.82rem; }
  .model-actions__override { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
  .model-actions__override .form-input { width: 12rem; min-width: 9rem; font-size: 0.8rem; }
  .catalog-list-section { margin-bottom: 1rem; }
  .catalog-list { display: grid; gap: 0.55rem; }
  .catalog-row { border: 1px solid rgba(0,0,0,0.10); border-radius: 8px; padding: 0.75rem; background: var(--surface, #fff); display: grid; grid-template-columns: minmax(18rem, 1.35fr) minmax(15rem, 1fr) minmax(22rem, 1.2fr) minmax(16rem, 0.9fr); gap: 0.75rem; align-items: start; min-width: 0; }
  .catalog-row__identity, .catalog-row__decision { min-width: 0; }
  .catalog-row__title { display: grid; gap: 0.35rem; }
  .catalog-row__name { margin-top: 0.12rem; color: var(--text-secondary); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .catalog-row__chips { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .catalog-row__description { margin-top: 0.4rem; color: var(--text-secondary); font-size: 0.8rem; line-height: 1.35; }
  .catalog-row__why { font-size: 0.86rem; color: var(--text); }
  .catalog-row__reasons, .catalog-row__warnings { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.4rem; font-size: 0.78rem; }
  .catalog-row__reasons { color: var(--text-secondary); }
  .catalog-row__warnings { color: var(--warning, #9a5b00); }
  .catalog-row__telemetry { grid-column: 1 / -1; color: var(--text-secondary); font-size: 0.78rem; }
  .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 0.75rem; align-items: stretch; }
  .catalog-card-section { margin-bottom: 1rem; }
  .catalog-section-head { display: flex; justify-content: space-between; gap: 1rem; align-items: end; padding: 0.35rem 0 0.5rem; }
  .catalog-section-head span, .catalog-section-head p { color: var(--text-secondary); font-size: 0.82rem; margin: 0; }
  .catalog-card { border: 1px solid rgba(0,0,0,0.10); border-radius: 8px; padding: 0.85rem; background: var(--surface, #fff); display: flex; flex-direction: column; min-width: 0; }
  .catalog-card__header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .catalog-card__title { min-width: 0; }
  .catalog-card__title .model-id { overflow-wrap: anywhere; line-height: 1.25; }
  .catalog-card__chips { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.4rem; }
  .catalog-card__price { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .catalog-card__price span { font-weight: 700; display: block; }
  .catalog-card__price small { color: var(--text-secondary); font-size: 0.72rem; }
  .catalog-card__why { margin-top: 0.65rem; font-size: 0.86rem; color: var(--text); }
  .catalog-card__reasons, .catalog-card__warnings { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.45rem; font-size: 0.78rem; }
  .catalog-card__reasons { color: var(--text-secondary); }
  .catalog-card__warnings { color: var(--warning, #9a5b00); }
  .catalog-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.35rem; }
  .catalog-metrics div { min-width: 0; padding: 0.45rem 0.5rem; border-radius: 6px; background: var(--surface-2, rgba(0,0,0,0.04)); }
  .catalog-metrics span { display: block; color: var(--text-secondary); font-size: 0.68rem; text-transform: uppercase; }
  .catalog-metrics strong { display: block; margin-top: 0.12rem; font-size: 0.82rem; overflow-wrap: anywhere; }
  .catalog-card__telemetry { margin-top: 0.55rem; color: var(--text-secondary); font-size: 0.78rem; }
  .catalog-empty { text-align: center; padding: 2rem; color: var(--text-secondary); border: 1px dashed rgba(0,0,0,0.16); border-radius: 8px; }
  .price-cell { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .preset-banner { padding: 0.75rem 1rem; border-radius: var(--radius); background: var(--surface-2); margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .preset-banner .preset-meta { color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem; }
  .preset-banner details { margin-top: 0.5rem; font-size: 0.85em; }
  .preset-banner details > summary { cursor: pointer; color: var(--text-secondary); user-select: none; list-style: none; }
  .preset-banner details > summary::-webkit-details-marker { display: none; }
  .preset-banner details > summary::before { content: "▸ "; display: inline-block; transition: transform 0.15s; }
  .preset-banner details[open] > summary::before { content: "▾ "; }
  .preset-banner details .formula { margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: rgba(0,0,0,0.04); border-left: 3px solid var(--accent); border-radius: 4px; line-height: 1.45; font-size: 0.9em; }
  .preset-banner details .formula code { background: rgba(0,0,0,0.06); padding: 0 0.25rem; border-radius: 3px; }
  .suggest-btn { margin-left: 0.5rem; }
  .table-wrap { overflow-x: auto; }
  .table-wrap table { width: 100%; }
  .models-section__header td { background: var(--surface-2); border-top: 1px solid rgba(0,0,0,0.08); border-bottom: 1px solid rgba(0,0,0,0.08); padding-top: 0.8rem; padding-bottom: 0.8rem; }
  /* KPI bar: cap individual card width so they don't sprawl on wide screens. */
  .kpi-bar { flex-wrap: wrap; }
  .kpi-item { flex: 1 1 150px; min-width: 130px; max-width: 200px; }
  .usage-toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .usage-chart-wrap { margin-bottom: 1.5rem; padding: 0.75rem 1rem; background: var(--surface-2, rgba(0,0,0,0.03)); border-radius: var(--radius); max-width: 800px; }
  .usage-chart-title { font-size: 0.82em; margin-bottom: 0.5rem; color: var(--text-secondary); }
  .usage-chart { width: 100%; height: auto; display: block; }
  .usage-chart rect:hover { opacity: 1 !important; }
  .usage-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
  .usage-section-h { font-size: 0.95em; margin-top: 0; margin-bottom: 0.5rem; font-weight: 600; }
  .usage-turns td { vertical-align: top; }
  .usage-turn__q { color: var(--text); margin-bottom: 0.25rem; font-size: 0.9em; }
  .usage-turn__a { color: var(--text-secondary); font-size: 0.9em; }
  .usage-empty { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
  .usage-empty__icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }
  .usage-empty__title { font-size: 1rem; font-weight: 600; margin-bottom: 0.4rem; }
  .usage-empty__hint { font-size: 0.875rem; }
  .ops-summary { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .ops-badge { display: inline-flex; gap: 0.35rem; align-items: center; border-radius: 999px; padding: 0.2rem 0.55rem; font-size: 0.78rem; background: var(--surface-2, rgba(0,0,0,0.05)); color: var(--text-secondary); }
  .ops-badge.ok { color: var(--success, #047857); }
  .ops-badge.warn { color: var(--warning, #9a5b00); }
  .ops-badge.running { color: var(--accent, #2563eb); }
  .ops-detail { margin-top: 0.4rem; }
  .ops-detail summary { cursor: pointer; color: var(--text); }
  .ops-pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2, rgba(0,0,0,0.04)); border-radius: 6px; padding: 0.55rem 0.65rem; margin: 0.35rem 0; }

  @media (max-width: 640px) {
    body { padding: 0 0.75rem 1.5rem; }
    .admin-section { margin-bottom: 1.25rem; }
    .filters { gap: 0.5rem; }
    .filters input[type="text"], .filters input[type="search"] { flex: 1 1 100%; min-width: 0; }
    .catalog-toolbar { align-items: stretch; }
    .catalog-tabs, .catalog-view-toggle { width: 100%; }
    .catalog-view-toggle .btn, .catalog-tabs .btn { flex: 1 1 auto; }
    .catalog-sort, .catalog-sort-dir { flex: 1 1 8rem; width: auto; }
    .catalog-row { grid-template-columns: 1fr; gap: 0.65rem; }
    .catalog-grid { grid-template-columns: 1fr; }
    .catalog-card { padding: 0.75rem; }
    .catalog-card__header { flex-direction: column; gap: 0.5rem; }
    .catalog-card__price { text-align: left; }
    .catalog-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .model-actions__override .form-input { width: 100%; }
    .usage-chart-wrap { padding: 0.5rem 0.6rem; }
    .usage-breakdown { grid-template-columns: 1fr; gap: 1rem; }
    .preset-banner { padding: 0.6rem 0.75rem; flex-direction: column; align-items: flex-start; }
    /* Min 40px touch target. */
    .btn { min-height: 40px; }
    /* Tables that didn't opt into .table-wrap scroll safely. */
    table { display: block; overflow-x: auto; max-width: 100%; }
    /* Settings form stacks label/input/button vertically. */
    .settings-row { grid-template-columns: 1fr; gap: 0.4rem; padding: 0.6rem 0; }
    .settings-row > :nth-child(2) { width: 100%; }
    .settings-input { width: 100% !important; }
    /* MCP server cards: labels become small captions above fields. */
    .mcp-card { padding: 0.75rem; }
    .mcp-field { grid-template-columns: 1fr; gap: 0.2rem; }
    .mcp-field label { padding-top: 0; font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.03em; }
  }
</style>
{{end}}

{{define "admin_header"}}
{{template "admin_tabs" .}}
{{end}}

<nav class="tab-nav" style="align-items:center;">
  <a class="navbar__brand" href="/" style="margin-right:1rem;font-weight:600;text-decoration:none;color:var(--text);white-space:nowrap;align-self:center;">Personal Assistant</a>
  <a class="{{if eq .ActiveTab "chat"}}active{{end}}" href="/chat">Chat</a>
  <a class="{{if eq .ActiveTab "routing"}}active{{end}}" href="/">Routing & Models</a>
  <a class="{{if eq .ActiveTab "analytics"}}active{{end}}" href="/analytics">Analytics</a>
  <a class="{{if eq .ActiveTab "evals"}}active{{end}}" href="/evals">Evals</a>
  <a class="{{if eq .ActiveTab "prompts"}}active{{end}}" href="/prompts">Prompts</a>
  <a class="{{if eq .ActiveTab "mcp"}}active{{end}}" href="/mcp">MCP</a>
  <a class="{{if eq .ActiveTab "settings"}}active{{end}}" href="/settings">Settings</a>
</nav>
{{end}}
